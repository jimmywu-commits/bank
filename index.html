    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
const LOCAL_KEY = 'banner_draft_v4';

function saveAll(){
  try{
    const data = {
      selected: document.getElementById('bank-selector')?.value || '__ALL__',
      html_single: document.getElementById('capture-area')?.innerHTML || '',
      html_all: document.getElementById('all-banks-wrapper')?.innerHTML || ''
    };
    localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
  }catch(e){console.warn(e);}
}

function loadAll(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);

    const selector = document.getElementById('bank-selector');
    if(selector && data.selected){
      const exists = Array.from(selector.options).some(o=>o.value===data.selected);
      if(exists) selector.value = data.selected;
    }

    if(data.selected === '__ALL__'){
      const wrap = document.getElementById('all-banks-wrapper');
      if(wrap && data.html_all) wrap.innerHTML = data.html_all;
    }else{
      const cap = document.getElementById('capture-area');
      if(cap && data.html_single) cap.innerHTML = data.html_single;
    }
  }catch(e){console.warn(e);}
}

document.addEventListener('input', saveAll);
document.addEventListener('click', ()=>setTimeout(saveAll,300));

function clearBannerDraftOnNewUpload(){
    try{
        localStorage.removeItem('banner_draft_v4');
        localStorage.removeItem('bank_banner_local_draft_v1');
        localStorage.removeItem('bank_banner_local_draft_v2');

        localStorage.removeItem('banner_draft_v1');
        localStorage.removeItem('banner_draft_v2');

const LOCAL_DRAFT_KEY = 'bank_banner_local_draft_v2';

function getCurrentSelectedValue(){
    const selector = document.getElementById('bank-selector');
    return selector ? (selector.value || '__ALL__') : '__ALL__';
}

function collectEditsFromScope(scope){
    const result = {
        footer: '',
        disclaimer: '',
        blocks: []
    };
    try{
        const footer = scope.querySelector('.footer-bar');
        if(footer) result.footer = footer.innerHTML;

        const infos = Array.from(scope.querySelectorAll('.info-block'));
        infos.forEach((block) => {
            const blockObj = {
                title: '',
                bgColor: '',
                items: [],
            };
            const header = block.querySelector('.block-header');
            if(header) blockObj.title = header.innerHTML;
            blockObj.bgColor = block.style.backgroundColor || '';

            const rows = Array.from(block.querySelectorAll('.item-row'));
            rows.forEach((row) => {
                const date = row.querySelector('.date-badge');
                const content = row.querySelector('.item-content');
                blockObj.items.push({
                    date: date ? date.innerHTML : '',
                    content: content ? content.innerHTML : ''
                });
            });

            result.blocks.push(blockObj);
        });

        const disclaimer = scope.querySelector('.disclaimer-outside');
        if(disclaimer) result.disclaimer = disclaimer.innerHTML;
    }catch(e){
        console.warn('collectEditsFromScope error', e);
    }
    return result;
}

function serializeCurrentState(){
    try{
        const selector = document.getElementById('bank-selector');
        const selectedValue = selector ? (selector.value || '__ALL__') : '__ALL__';

        const state = {
            selectedValue,
            sourceBankData: Array.isArray(allBankData) ? allBankData : [],
            perBankEdits: {}
        };

        // Save single current capture area under current selected bank
        const capture = document.getElementById('capture-area');
        if(capture && selectedValue && selectedValue !== '__ALL__'){
            state.perBankEdits[selectedValue] = collectEditsFromScope(capture);
        }

        // Save all-banks cards if present
        const allWrap = document.getElementById('all-banks-wrapper');
        if(allWrap){
            const banners = Array.from(allWrap.querySelectorAll('.banner-container'));
            banners.forEach((banner) => {
                const bankName = banner.getAttribute('data-bank-name') || '';
                const bank = Array.isArray(allBankData) ? allBankData.find(x => (x.logoName || '') === bankName) : null;
                const key = bank ? bank.id : bankName;
                if(key){
                    state.perBankEdits[key] = collectEditsFromScope(banner);
                }
            });
        }

        return state;
    }catch(e){
        console.warn('serializeCurrentState error', e);
        return null;
    }
}

function saveDraftToLocal(){
    try{
        const state = serializeCurrentState();
        if(!state) return;
        localStorage.setItem(LOCAL_DRAFT_KEY, JSON.stringify(state));
    }catch(e){
        console.warn('saveDraftToLocal error', e);
    }
}

function loadDraftFromLocal(){
    try{
        const raw = localStorage.getItem(LOCAL_DRAFT_KEY);
        if(!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return null;
        if (!Array.isArray(parsed.sourceBankData)) parsed.sourceBankData = [];
        if (!parsed.perBankEdits || typeof parsed.perBankEdits !== 'object') parsed.perBankEdits = {};
        return parsed;
    }catch(e){
        console.warn('loadDraftFromLocal error', e);
        return null;
    }
}

function applyEditsToScope(scope, saved){
    try{
        if(!scope || !saved) return;
        const infos = Array.from(scope.querySelectorAll('.info-block'));
        infos.forEach((block, i) => {
            const savedBlock = (saved.blocks || [])[i];
            if(!savedBlock) return;

            const header = block.querySelector('.block-header');
            if(header && typeof savedBlock.title === 'string') header.innerHTML = savedBlock.title;
            if(savedBlock.bgColor) block.style.backgroundColor = savedBlock.bgColor;

            const rows = Array.from(block.querySelectorAll('.item-row'));
            rows.forEach((row, j) => {
                const savedItem = (savedBlock.items || [])[j];
                if(!savedItem) return;

                const date = row.querySelector('.date-badge');
                const content = row.querySelector('.item-content');
                if(date && typeof savedItem.date === 'string') date.innerHTML = savedItem.date;
                if(content && typeof savedItem.content === 'string') content.innerHTML = savedItem.content;
            });
        });

        const disclaimer = scope.querySelector('.disclaimer-outside');
        if(disclaimer && typeof saved.disclaimer === 'string') disclaimer.innerHTML = saved.disclaimer;

        const footer = scope.querySelector('.footer-bar');
        if(footer && typeof saved.footer === 'string' && saved.footer) footer.innerHTML = saved.footer;
    }catch(e){
        console.warn('applyEditsToScope error', e);
    }
}

function applyDraftForCurrentSelection(){
    try{
        const draft = loadDraftFromLocal();
        if(!draft) return;

        const selectedValue = getCurrentSelectedValue();

        if(selectedValue === '__ALL__'){
            const allWrap = document.getElementById('all-banks-wrapper');
            const banners = Array.from(allWrap.querySelectorAll('.banner-container'));
            banners.forEach((banner) => {
                const bankName = banner.getAttribute('data-bank-name') || '';
                const bank = Array.isArray(allBankData) ? allBankData.find(x => (x.logoName || '') === bankName) : null;
                const key = bank ? bank.id : bankName;
                if(key && draft.perBankEdits && draft.perBankEdits[key]){
                    applyEditsToScope(banner, draft.perBankEdits[key]);
                }
            });
        } else {
            const capture = document.getElementById('capture-area');
            if(draft.perBankEdits && draft.perBankEdits[selectedValue]){
                applyEditsToScope(capture, draft.perBankEdits[selectedValue]);
            }
        }

        syncDateBadgeWidths(document);
        syncSidebarHeightToRightContent(document);
        setupItemContentEditing(document);
        bindAutosave(document);
    }catch(e){
        console.warn('applyDraftForCurrentSelection error', e);
    }
}

function restoreSelectorFromDraft(){
    try{
        const draft = loadDraftFromLocal();
        if(!draft || !draft.selectedValue) return false;
        const selector = document.getElementById('bank-selector');
        if(!selector) return false;
        const hasOption = Array.from(selector.options).some(opt => opt.value === draft.selectedValue);
        if(!hasOption) return false;
        selector.value = draft.selectedValue;
        return true;
    }catch(e){
        console.warn('restoreSelectorFromDraft error', e);
        return false;
    }
}

function bindAutosave(scope){
    try{
        const root = scope || document;
        const editableNodes = root.querySelectorAll('.date-badge[contenteditable], .item-content[contenteditable], .block-header[contenteditable], .disclaimer-outside[contenteditable], .footer-bar[contenteditable]');
        editableNodes.forEach((node) => {
            if(node.dataset.autosaveBound === '1') return;
            node.dataset.autosaveBound = '1';
            node.addEventListener('input', function(){
                saveDraftToLocal();
                syncDateBadgeWidths(document);
                syncSidebarHeightToRightContent(document);
            });
            node.addEventListener('blur', saveDraftToLocal);
        });
    }catch(e){
        console.warn('bindAutosave error', e);
    }
}




function setupItemContentEditing(scope){
    try{
        const root = scope || document;
        const editableNodes = root.querySelectorAll('.date-badge[contenteditable="true"], .item-content[contenteditable="true"], .block-header[contenteditable], .disclaimer-outside[contenteditable]');
        editableNodes.forEach(function(node){
            if (node.dataset.editBound === '1') return;
            node.dataset.editBound = '1';

            node.addEventListener('keydown', function(e){
                if (e.key === 'Enter') {
                    // Keep line breaks inside the same editable column instead of creating new block structure
                    e.preventDefault();
                    try {
                        document.execCommand('insertLineBreak');
                    } catch(err) {
                        document.execCommand('insertHTML', false, '<br>');
                    }
                }
            });

            node.addEventListener('paste', function(e){
                // Keep pasted content plain to avoid unexpected nested blocks
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                document.execCommand('insertText', false, text);
            });
        });
    }catch(e){
        console.warn('setupItemContentEditing error', e);
    }
}



function syncSidebarHeightToRightContent(scope){
    try{
        const root = scope || document;
        const wrappers = root.querySelectorAll('.content-wrapper');
        wrappers.forEach(function(wrapper){
            const left = wrapper.querySelector('.left-sidebar');
            const right = wrapper.querySelector('.right-content');
            const logoBox = wrapper.querySelector('.logo-box');
            if(!left || !right || !logoBox) return;

            // reset first
            left.style.height = 'auto';
            logoBox.style.height = 'auto';

            const rightHeight = Math.ceil(right.offsetHeight);
            if(rightHeight > 0){
                left.style.height = rightHeight + 'px';
                logoBox.style.height = rightHeight + 'px';
            }
        });
    }catch(e){
        console.warn('syncSidebarHeightToRightContent error', e);
    }
}


function syncDateBadgeWidths(scope){
    try{
        const root = scope || document;
        const wrappers = root.querySelectorAll('.content-wrapper');
        wrappers.forEach(function(wrapper){
            const badges = Array.from(wrapper.querySelectorAll('.date-badge'));
            if(!badges.length) return;

            const baseWidth = 218;
            let maxWidth = baseWidth;

            badges.forEach(function(badge){
                badge.style.width = 'auto';
                badge.style.minWidth = baseWidth + 'px';
                badge.style.maxWidth = 'none';
                badge.style.flexBasis = 'auto';

                const needed = Math.ceil(Math.max(
                    badge.scrollWidth || 0,
                    badge.getBoundingClientRect ? badge.getBoundingClientRect().width : 0,
                    baseWidth
                ));

                if(needed > maxWidth) maxWidth = needed;
            });

            badges.forEach(function(badge){
                badge.style.width = maxWidth + 'px';
                badge.style.minWidth = maxWidth + 'px';
                badge.style.maxWidth = maxWidth + 'px';
                badge.style.flexBasis = maxWidth + 'px';
            });
        });
    }catch(e){
        console.warn('syncDateBadgeWidths error', e);
    }
}


        
// === 上傳狀態旗標（防呆用） ===
let hasWorkOrder = false; // 解析工單完成後設為 true
let hasLogos = false;     // 讀取 LOGO 資料夾後設為 true


function setFloatingTipText(which){
    try{
        const box = document.getElementById('floatingTip');
        const redEl = document.getElementById('floatingTipMsg');
        const greyEl = document.getElementById('floatingTipGrey');
        if(!box) return;

        // 取選取文字，沒有就用 prompt
        let text = '';
        try{
            const sel = window.getSelection();
            if(sel) text = String(sel.toString() || '').trim();
        }catch(e){}

        if(!text){
            text = prompt(which === 'grey' ? '請輸入右上灰字內容' : '請輸入右上紅字內容', '');
            if(text === null) return; // cancel
            text = String(text).trim();

function showTip(message, autoHideMs){
    try{
        const box = document.getElementById('floatingTip');
        const msg = document.getElementById('floatingTipMsg');
        if(!box || !msg) return;
        msg.textContent = message || '提醒';
        box.style.display = 'block';
        if(autoHideMs && autoHideMs > 0){
            setTimeout(()=>{ box.style.display='none'; }, autoHideMs);
        }
    }catch(e){}
}
/* ===== 工單 + 圖片：一次上傳（資料夾） =====
   - 優先：File System Access API（Chromium 系）
   - fallback：<input webkitdirectory>（常見相容方案）
*/
async function triggerWorkOrderWithImages() {
    // 本頁已拆成「上傳工單」與「上傳 LOGO」兩個按鈕。
    // 避免在 file:// 下使用 showDirectoryPicker 造成瀏覽器安全限制錯誤。
    const input = document.getElementById('fileInput');
    if (input) {
        input.value = '';
        input.click();
    }
}

async function pickWorkOrderDirectoryViaFSAccess() {
    const dirHandle = await window.showDirectoryPicker();
    const files = [];

    async function walkDirectory(handle, basePath = '') {
        for await (const [, entry] of handle.entries()) {
            if (entry.kind === 'file') {
                try {
                    const f = await entry.getFile();
                    try { f.relativePath = basePath + f.name; } catch(e) {}
                files.push(f);
                } catch (e) {
                    console.warn('[FolderUpload] getFile 失敗：', e);
                }
            } else if (entry.kind === 'directory') {
                await walkDirectory(entry, basePath + entry.name + '/');
            }
        }
    }

    await walkDirectory(dirHandle, '');
    handleWorkOrderFolderFiles(files, true);
}

function handleWorkOrderFolderFiles(fileList, fromFSAccess = false) {
    const arr = Array.from(fileList || []);
    if (!arr.length) {
        showToast('資料夾內沒有檔案', 'error');
        return;
    }

    const workOrder = arr.find(f => {
        const n = (f && f.name) ? f.name.toLowerCase() : '';
        return n.endsWith('.xlsx') || n.endsWith('.xls') || n.endsWith('.csv');
    });

    const images = arr.filter(f => {
        if (!f) return false;
        if (f.type && f.type.startsWith('image/')) return true;
        const n = (f.name || '').toLowerCase();
        return n.endsWith('.png') || n.endsWith('.jpg') || n.endsWith('.jpeg') || n.endsWith('.gif') || n.endsWith('.webp') || n.endsWith('.svg');
    });

    if (!workOrder) {
        showToast('資料夾內找不到工單檔（.xlsx/.xls/.csv）', 'error');
    } else {
        handleFile(workOrder);
        showToast(`已從資料夾載入工單：${workOrder.name}${fromFSAccess ? '（File System Access API）' : ''}`, 'success');
    }

    if (images.length) {
        handleLogoFolderFiles(images);

            const normBank = normalizeName(safeName);
            if (!normBank) return null;

            let bestScore = 0;

            for (const key of logoNameToUrl.keys()) {
                const normKey = normalizeName(key);
                if (!normKey) continue;

                let score = 0;
                if (normKey === normBank) score = 100;

                else {

                    const longer = normKey.length >= normBank.length ? normKey : normBank;
                    if (shorter.length >= 2 && longer.includes(shorter)) score = 60 + shorter.length;

let __savedRange = null;

function saveSelectionRange() {
    try {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const r = sel.getRangeAt(0);
        if (!r || r.collapsed) return;

        let container = document.getElementById('right-content-area');
        const common = r.commonAncestorContainer;
        const commonEl = common.nodeType === 1 ? common : common.parentElement;

        // 全部銀行模式：每張卡片會有自己的 .right-content
        if (!container && commonEl) {
            container = commonEl.closest('.right-content');
        }

        if (!container || !commonEl || !container.contains(commonEl)) return;

        __savedRange = r.cloneRange();
    } catch (e) {}
}

document.addEventListener('mouseup', saveSelectionRange);

function applyColorToSelection(color) {
    try {
        const sel = window.getSelection();
        const range = (__savedRange && !__savedRange.collapsed)
            ? __savedRange
            : (sel && sel.rangeCount ? sel.getRangeAt(0) : null);

        if (!range || range.collapsed) return;

        const common = range.commonAncestorContainer;
        const commonEl = common.nodeType === 1 ? common : common.parentElement;

        // 單一銀行模式：#right-content-area
        // 全部銀行模式：每張 Banner 內都有自己的 .right-content

            const nearest = commonEl.closest('.right-content');
            if (nearest) container = nearest;
        }

        if (!commonEl || !container || !container.contains(commonEl)) return;

        if (sel) {
            sel.removeAllRanges();
            sel.addRange(range);
        }

        const span = document.createElement('span');
        span.style.color = color;

        try {
            range.surroundContents(span);

/* ===== 下載前固定 LOGO 視覺：避免 html2canvas 對 object-fit 支援不完整造成拉伸 ===== */
async function freezeLogoImagesForDownload(container) {
    const restoreTasks = [];
    const loadPromises = [];

    try {
        const root = container || document;
        const imgs = Array.from(root.querySelectorAll('img.logo-img'));

        imgs.forEach(img => {
            if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) return;

            const holder = img.closest('.logo-img-container') || img.parentElement || img;
            const rect = holder.getBoundingClientRect();
            const boxW = Math.max(1, Math.round(rect.width));
            const boxH = Math.max(1, Math.round(rect.height));
            if (!boxW || !boxH) return;

            const canvas = document.createElement('canvas');
            canvas.width = boxW;
            canvas.height = boxH;
            const ctx = canvas.getContext('2d');

            // 底色改用 logo-box 實際吸到的顏色（找不到或透明時才退回白底，避免 JPG 變黑）
            let fillColor = '#FFFFFF';
            try {
                const logoBox = img.closest('.logo-box');
                const bg = logoBox ? window.getComputedStyle(logoBox).backgroundColor : '';
                if (bg && bg !== 'transparent' && !/rgba\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*0\s*\)/.test(bg)) {
                    fillColor = bg;
                }
            } catch (e) {}
            ctx.fillStyle = fillColor;
            ctx.fillRect(0, 0, boxW, boxH);

            const imgRatio = img.naturalWidth / img.naturalHeight;
            const boxRatio = boxW / boxH;

            let drawW, drawH, drawX, drawY;

            // 完全等比例 contain：跟前端 object-fit: contain 的視覺一致，不拉伸
            if (imgRatio > boxRatio) {
                drawW = boxW;
                drawH = boxW / imgRatio;
                drawX = 0;
                drawY = (boxH - drawH) / 2;
            } else {
                drawH = boxH;
                drawW = boxH * imgRatio;
                drawX = (boxW - drawW) / 2;
                drawY = 0;
            }

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, drawX, drawY, drawW, drawH);

            const oldSrc = img.src;
            const oldStyle = {
                width: img.style.width,
                height: img.style.height,
                maxWidth: img.style.maxWidth,
                maxHeight: img.style.maxHeight,
                objectFit: img.style.objectFit,
                display: img.style.display
            };

            const pngUrl = canvas.toDataURL('image/png');

            const p = new Promise(resolve => {
                const done = () => {
                    img.removeEventListener('load', done);
                    img.removeEventListener('error', done);
                    resolve();
                };
                img.addEventListener('load', done);
                img.addEventListener('error', done);
                img.src = pngUrl;
                img.style.width = boxW + 'px';
                img.style.height = boxH + 'px';
                img.style.maxWidth = 'none';
                img.style.maxHeight = 'none';
                img.style.objectFit = 'fill';
                img.style.display = 'block';
            });

            loadPromises.push(p);

            restoreTasks.push(() => {
                img.src = oldSrc;
                img.style.width = oldStyle.width;
                img.style.height = oldStyle.height;
                img.style.maxWidth = oldStyle.maxWidth;
                img.style.maxHeight = oldStyle.maxHeight;
                img.style.objectFit = oldStyle.objectFit;
                img.style.display = oldStyle.display;
            });
        });

        await Promise.all(loadPromises);
        // 給瀏覽器一個 frame 完成重排，避免 html2canvas 抓到舊狀態
        await new Promise(resolve => requestAnimationFrame(() => resolve()));
    } catch (e) {
        console.warn('[DownloadLogoFreeze] failed:', e);
    }

    return function restoreFrozenLogos() {
        restoreTasks.reverse().forEach(fn => {
            try { fn(); } catch(e) {}
        });
    };
}

                        loadBankLogoFromDefaultPath(safeName, imgElement, logoBox);
                    };

                }
            }

        function loadBankLogoFromDefaultPath(safeName, imgElement, logoBox) {
            const candidates = [
                `./logo/${safeName}.jpg`,
                `./logo/${safeName}.jpeg`,
                `./logo/${safeName}.png`
            ];

            let currentIndex = 0;

            function tryNext() {
                if (currentIndex >= candidates.length) {
                    useFallbackLogo(imgElement, logoBox, `找不到對應 Logo：${safeName}（已使用預設 Logo）`);
                    return;
                }

                const path = candidates[currentIndex];
                console.log("[Logo] 嘗試載入預設路徑：", path);

                imgElement.onload = function() {
                    extractAndSetColor(imgElement);
                    showToast(`已載入 Logo：${path}`, 'success');
                };

                imgElement.onerror = function() {
                    console.warn("[Logo] 載入失敗，嘗試下一個：", path);
                    currentIndex++;
                    tryNext();
                };

                imgElement.src = path;
                logoBox.style.backgroundColor = "#FFFFFF";
            }

            tryNext();
        }

        function useFallbackLogo(imgElement, logoBox, msg) {
            console.warn("[Logo] 使用預設 fallback Logo：", FALLBACK_LOGO_PATH);
            imgElement.onload = function() {
                logoBox.style.backgroundColor = "#FFFFFF";
                if (msg) showToast(msg, 'error');
            };
            imgElement.onerror = function() {

        function processContent(contentString) {
            const blocks = [];
            let currentBlock = null;
            
            const lines = (contentString || '')
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            for (const line of lines) {
                if (line.startsWith('【') && line.endsWith('】')) {
                    const title = line.substring(1, line.length - 1).trim();
                    currentBlock = {
                        title,
                        items: [],
                        disclaimer: null
                    };
                    blocks.push(currentBlock);
                } else if (/^(※|\*)/.test(line)) {
                    if (!currentBlock) continue;
                    const clean = line.replace(/^(※|\*)\s*/, '');
                    if (currentBlock.disclaimer) {
                        currentBlock.disclaimer += ' ' + clean;
                    } else {
                        currentBlock.disclaimer = clean;
                    }
                } else if (currentBlock) {
                    currentBlock.items.push(line);
                }
            }
            return blocks;
        }

        function parseXlsxToRecords(workbook) {
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, {
                header: 1,
                raw: true
            });

            const records = [];

            rows.forEach((row, index) => {
                if (!row || row.length < 4) return;

                const idRaw      = String(row[0] ?? '').trim();
                const logoRaw    = String(row[1] ?? '').trim();
                const contentRaw = String(row[2] ?? '').trim();
                const footerRaw  = String(row[3] ?? '').trim();

                if (!idRaw) return;

                const firstLine = logoRaw.split(/\r?\n/)[0].trim();
                const logoName  = firstLine;

                const content = contentRaw;
                let footer = footerRaw.replace(/^['\"]|['\"]$/g, '').trim();

                if (!footer) footer = '限量/看詳情';
records.push({
                    id: idRaw,
                    logoName,
                    content,
                    footer
                });
            });

            if (records.length === 0) {
                alert("XLSX 工單資料為空或格式不符合（至少需要 A~D 四欄）。");
            }

            return records;
        }

        function parseCsvToRecords(csvText) {
            const records = [];
            const lines = csvText.split(/\r?\n/);

            lines.forEach((line, idx) => {
                if (!line.trim()) return;
                const cols = [];
                let col = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === '"') {
                        inQuotes = !inQuotes;
                    } else if (ch === ',' && !inQuotes) {
                        cols.push(col);
                        col = '';
                    } else {
                        col += ch;
                    }
                }
                cols.push(col);

                if (cols.length < 4) return;

                const idRaw      = cols[0].trim();
                const logoRaw    = cols[1].trim();
                const contentRaw = cols[2].trim();
                const footerRaw  = cols[3].trim();

                if (!idRaw) return;

                const firstLine = logoRaw.split(/\r?\n/)[0].trim();
                const logoName  = firstLine;

                const content = contentRaw;
                let footer = footerRaw.replace(/^['\"]|['\"]$/g, '').trim();

                if (!footer) footer = '限量/看詳情';
records.push({ id: idRaw, logoName, content, footer });
            });

            return records;
        }

        function handleFile(file) {
            const reader = new FileReader();

            reader.onload = function(e) {
                const data = e.target.result;

                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    try {
                        const workbook = XLSX.read(data, { type: 'array' });
                        allBankData = parseXlsxToRecords(workbook);
                    } catch (err) {
                        alert("讀取 XLSX 檔案錯誤：" + err.message);
                        return;
                    }
                } else if (file.name.endsWith('.csv')) {
                    const text = typeof data === 'string' ? data : new TextDecoder('utf-8').decode(data);
                    allBankData = parseCsvToRecords(text);
                } else {
                    alert("不支援的檔案格式，請上傳 XLSX / XLS / CSV。");
                    return;
                }

                if (allBankData.length > 0) {
                    clearBannerDraftOnNewUpload();

                    if (selector) selector.value = '__ALL__';
                    loadBankData('__ALL__');

        syncSidebarHeightToRightContent(document); } catch(e) {}
                    showToast('已載入工單，共 ' + allBankData.length + ' 筆', 'success');
                } else {
                    alert("工單資料解析失敗，請確認 A~D 四欄資料是否存在。");
                }
            };

            if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file, 'UTF-8');
            }
        }

// === 強制只吃「LOGO方」資料夾內的圖片（寫死規則） ===
function isLogoFangFile(file, relativePath) {
  // 支援兩種情境：
  // 1) 上傳整包資料夾：路徑內含 LOGO方/
  // 2) 直接選 LOGO方 資料夾本身：webkitRelativePath 通常是「LOGO方/xxx.png」
  // 3) 若瀏覽器只回傳檔名，也允許圖片進入，避免按鈕看似無反應
  const path = String(relativePath || file.name || "");
  const normalized = path.replace(/\\/g, "/");
  if (normalized.includes("LOGO橫/") || normalized.includes("程式檔案/LOGO橫")) return false;
  if (normalized.includes("LOGO方/")) return true;
  return !normalized.includes("/");
}

        navigator.clipboard.writeText(path).then(function() {
            if (typeof showToast === 'function') showToast('已複製 LOGO 歸檔路徑', 'success');
            else alert('已複製路徑');
        }).catch(function() {
            fallbackCopyLogoArchivePath(path);
        });
    } else {
        fallbackCopyLogoArchivePath(path);
    }
}

function fallbackCopyLogoArchivePath(path) {
    const ta = document.createElement('textarea');
    ta.value = path;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    if (typeof showToast === 'function') showToast('已複製 LOGO 歸檔路徑', 'success');
    else alert('已複製路徑');
}

/* ===== 說明書彈窗 ===== */
const MANUAL_IMAGE_URL = 'https://github.com/jimmywu-commits/index/blob/main/bankindex.png?raw=true';
const MANUAL_HIDE_KEY = 'index_manual_hide_date';

function todayKeyForManual() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

function openManualModal() {
    const modal = document.getElementById('manualModal');
    if (!modal) return;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
}

function closeManualModal() {
    const checkbox = document.getElementById('manualDontShowToday');
    if (checkbox && checkbox.checked) {
        try {
            localStorage.setItem(MANUAL_HIDE_KEY, todayKeyForManual());
        } catch(e) {}
    }
    const modal = document.getElementById('manualModal');
    if (!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
}

function shouldShowManualToday() {
    try {
        return localStorage.getItem(MANUAL_HIDE_KEY) !== todayKeyForManual();
    } catch(e) {
        return true;
    }
}

/* ===== Logo 編輯器工具：上傳 / 拖曳 / 縮放 / 裁切 / 下載 ===== */
const logoEditorState = {
    img: null,
    imgSrc: '',
    originalFileName: 'logo_edited',
    scale: 1,
    x: 380,
    y: 210,
    dragging: false,
    startX: 0,
    startY: 0,
    startImgX: 0,
    startImgY: 0,
    cropW: 234,
    cropH: 234
};

function openLogoEditorTool() {
    const modal = document.getElementById('logoEditorModal');
    if (!modal) return;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(drawLogoEditor);
}

function closeLogoEditorTool() {
    const modal = document.getElementById('logoEditorModal');
    if (!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
}

function logoEditorCanvas() {
    return document.getElementById('logoEditorCanvas');
}

function logoEditorSetCrop() {
    const w = Number(document.getElementById('logoEditorCropW')?.value || 234);
    const h = Number(document.getElementById('logoEditorCropH')?.value || 234);
    const canvas = logoEditorCanvas();
    if (!canvas) return;
    logoEditorState.cropW = Math.max(50, Math.min(canvas.width, w));
    logoEditorState.cropH = Math.max(50, Math.min(canvas.height, h));
    drawLogoEditor();
}

function logoEditorSetZoom(scale) {
    if (!logoEditorState.img) return;
    const next = Math.max(0.1, Math.min(4, Number(scale) || 1));
    logoEditorState.scale = next;
    const slider = document.getElementById('logoEditorZoom');
    const text = document.getElementById('logoEditorZoomText');
    if (slider) slider.value = Math.round(next * 100);
    if (text) text.textContent = Math.round(next * 100) + '%';
    drawLogoEditor();
}

function logoEditorZoomStep(step) {
    logoEditorSetZoom((logoEditorState.scale || 1) + step);
}

function logoEditorFit() {
    const canvas = logoEditorCanvas();
    const img = logoEditorState.img;
    if (!canvas || !img) return;
    const cropW = logoEditorState.cropW || 234;
    const cropH = logoEditorState.cropH || 234;
    const fit = Math.min(cropW / img.naturalWidth, cropH / img.naturalHeight);
    logoEditorState.scale = Math.max(0.1, Math.min(4, fit));
    logoEditorState.x = canvas.width / 2;
    logoEditorState.y = canvas.height / 2;
    logoEditorSetZoom(logoEditorState.scale);
    drawLogoEditor();
}

function drawLogoEditor() {
    const canvas = logoEditorCanvas();
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cropW = Math.max(50, Math.min(canvas.width, logoEditorState.cropW || 234));
    const cropH = Math.max(50, Math.min(canvas.height, logoEditorState.cropH || 234));
    const cropX = (canvas.width - cropW) / 2;
    const cropY = (canvas.height - cropH) / 2;

    if (logoEditorState.img) {
        const img = logoEditorState.img;
        const w = img.naturalWidth * logoEditorState.scale;
        const h = img.naturalHeight * logoEditorState.scale;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, logoEditorState.x - w / 2, logoEditorState.y - h / 2, w, h);
    } else {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.font = '20px Arial, "Microsoft JhengHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('請先上傳 Logo 圖片', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, canvas.width, cropY);
    ctx.fillRect(0, cropY + cropH, canvas.width, canvas.height - cropY - cropH);
    ctx.fillRect(0, cropY, cropX, cropH);
    ctx.fillRect(cropX + cropW, cropY, canvas.width - cropX - cropW, cropH);

    ctx.strokeStyle = '#00E5FF';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 5]);
    ctx.strokeRect(cropX, cropY, cropW, cropH);

    ctx.setLineDash([]);
    ctx.fillStyle = '#00E5FF';
    ctx.font = '13px Arial, "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${Math.round(cropW)} × ${Math.round(cropH)} px`, cropX + 8, cropY + 18);
    ctx.restore();
}

function downloadEditedLogo() {
    const canvas = logoEditorCanvas();
    const img = logoEditorState.img;
    if (!canvas || !img) {
        showToast('請先上傳圖片', 'error');
        return;
    }

    const cropW = Math.max(50, Math.min(canvas.width, logoEditorState.cropW || 234));
    const cropH = Math.max(50, Math.min(canvas.height, logoEditorState.cropH || 234));
    const cropX = (canvas.width - cropW) / 2;
    const cropY = (canvas.height - cropH) / 2;

    const output = document.createElement('canvas');
    output.width = Math.round(cropW);
    output.height = Math.round(cropH);
    const octx = output.getContext('2d');

    octx.fillStyle = '#FFFFFF';
    octx.fillRect(0, 0, output.width, output.height);

    const w = img.naturalWidth * logoEditorState.scale;
    const h = img.naturalHeight * logoEditorState.scale;
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = 'high';
    octx.drawImage(img, logoEditorState.x - w / 2 - cropX, logoEditorState.y - h / 2 - cropY, w, h);

    const link = document.createElement('a');
    link.download = (logoEditorState.originalFileName || 'logo_edited') + '.jpg';
    link.href = output.toDataURL('image/jpeg', 0.95);
    link.click();
}

function initLogoEditorTool() {
    const input = document.getElementById('logoEditorFile');
    const canvas = logoEditorCanvas();
    if (!input || !canvas || input.dataset.bound === '1') return;
    input.dataset.bound = '1';

    input.addEventListener('change', function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                logoEditorState.img = img;
                logoEditorState.imgSrc = evt.target.result;
                logoEditorState.originalFileName = (file.name || 'logo_edited').replace(/\.[^.]+$/, '');
                logoEditorSetCrop();
                logoEditorFit();
                showToast('Logo 已載入，可開始編輯', 'success');
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        input.value = '';
    });

    canvas.addEventListener('mousedown', function(e) {
        if (!logoEditorState.img) return;
        const rect = canvas.getBoundingClientRect();
        logoEditorState.dragging = true;
        logoEditorState.startX = (e.clientX - rect.left) * (canvas.width / rect.width);
        logoEditorState.startY = (e.clientY - rect.top) * (canvas.height / rect.height);
        logoEditorState.startImgX = logoEditorState.x;
        logoEditorState.startImgY = logoEditorState.y;
        canvas.classList.add('dragging');
        e.preventDefault();
    });

    window.addEventListener('mousemove', function(e) {
        if (!logoEditorState.dragging) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        logoEditorState.x = logoEditorState.startImgX + (x - logoEditorState.startX);
        logoEditorState.y = logoEditorState.startImgY + (y - logoEditorState.startY);
        drawLogoEditor();
    });

    window.addEventListener('mouseup', function() {
        logoEditorState.dragging = false;
        canvas.classList.remove('dragging');
    });

    canvas.addEventListener('wheel', function(e) {
        if (!logoEditorState.img) return;
        e.preventDefault();
        logoEditorZoomStep(e.deltaY < 0 ? 0.05 : -0.05);
    }, { passive: false });

    drawLogoEditor();
}

document.addEventListener('DOMContentLoaded', function() {
    initLogoEditorTool();
    if (shouldShowManualToday()) {
        setTimeout(openManualModal, 250);
    }
});
