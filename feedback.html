<script>

// === 上傳狀態旗標（防呆用） ===
let hasWorkOrder = false; // 解析工單完成後設為 true
let hasLogos = false;     // 讀取 LOGO 資料夾後設為 true

function showTip(message, autoHideMs){
    try{
        const box = document.getElementById('floatingTip');
        const msg = document.getElementById('floatingTipMsg');
        if(!box || !msg) return;
        msg.textContent = message || '提醒';
        box.style.display = 'block';
        if(autoHideMs && autoHideMs > 0){
            setTimeout(()=>{ box.style.display='none'; }, autoHideMs);
        }
    }catch(e){}
}

/* ===== Toast 浮動視窗 ===== */
function showToast(message, type) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'toast ' + (type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : 'toast-info');
    div.textContent = message;
    container.appendChild(div);
    setTimeout(() => {
        div.style.opacity = '0';
        div.style.transform = 'translateY(-4px)';
        div.style.transition = 'opacity 0.3s, transform 0.3s';
        setTimeout(() => container.removeChild(div), 300);
    }, 2600);
}

/* ===== 共用工具 ===== */
function updateSize(type, val) {
    let cssVar;
    if (type === 'title') cssVar = '--title-size';
    else if (type === 'date') cssVar = '--date-size';
    else if (type === 'content') cssVar = '--content-size';
    else if (type === 'note') cssVar = '--note-size';
    if (cssVar) {
        document.documentElement.style.setProperty(cssVar, val + 'px');
    }
}

/* ===== LOGO 資料夾處理（模糊比對） ===== */
const logoMap = {}; // key: 正規化檔名, value: objectURL

function normalizeName(str) {
    return (str || '')
        .toLowerCase()
        .replace(/\.[^.]+$/,'')                     // 去副檔名
        .replace(/[ \t\r\n\-_\u3000]/g,'')          // 去空白與常見連接字元
        .replace(/[()（）\[\]【】「」]/g,'');       // 去括號類
}

document.getElementById('logoFolderInput').addEventListener('change', function(e) {
    const files = e.target.files;
    let count = 0;
    for (const f of files) {
        if (!f.type.startsWith('image/')) continue;
        const key = normalizeName(f.name);
        const url = URL.createObjectURL(f);
        logoMap[key] = url;
        count++;
    }
    if (count > 0) {
        showToast('已載入 LOGO 共 ' + count + ' 張', 'success');
    } else {
        showToast('未偵測到圖片檔，請確認資料夾內容', 'error');
    }

    // 重新套用 LOGO（即使先上傳工單、後上傳 LOGO 也會更新）
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        const name = card.dataset.logoName || '';
        const img = card.querySelector('.card-logo');
        if (img) img.src = findLogoSrc(name);
    
    hasLogos = Object.keys(logoMap || {}).length > 0;
});});

function findLogoSrc(bankName) {
    const baseDefault = './logo橫/BANK LOGO.jpg';
    const norm = normalizeName(bankName);
    if (!norm) return baseDefault;

    let bestKey = null;
    let bestScore = 0;

    for (const key in logoMap) {
        if (!logoMap.hasOwnProperty(key)) continue;
        let score = 0;
        if (key === norm) score = 3;
        else if (key.includes(norm) || norm.includes(key)) score = 2;
        if (score > bestScore) {
            bestScore = score;
            bestKey = key;
        }
    }
    return bestKey ? logoMap[bestKey] : baseDefault;
}

function findWorksheetName(workbook, keyword) {
    if (!workbook || !Array.isArray(workbook.SheetNames)) return null;

    // 先找完全同名；如果工單頁簽有月份前綴，則從左到右找第一個包含關鍵字的頁簽。
    const exactMatch = workbook.SheetNames.find(name => name === keyword);
    if (exactMatch) return exactMatch;

    return workbook.SheetNames.find(name => String(name || '').includes(keyword)) || null;
}

/* ===== 工單上傳 / 解析 XLSX ===== */
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        let workbook;
        try {
            workbook = XLSX.read(data, { type: 'array' });
        } catch (err) {
            showToast('XLSX 解析失敗：' + err.message, 'error');
            return;
        }

        const targetSheetKeyword = '信用卡回饋方案';
        const sheetName = findWorksheetName(workbook, targetSheetKeyword);
        const sheet = sheetName ? workbook.Sheets[sheetName] : null;
        if (!sheet) {
            showToast('找不到包含「' + targetSheetKeyword + '」的工作表', 'error');
            console.warn('可用工作表：', workbook.SheetNames);
            return;
        }
        showToast('已選用工作表：' + sheetName, 'info');

        function cell(addr) {
            const c = sheet[addr];
            return c ? String(c.v) : '';
        }

        // 標題 A1
        const a1 = cell('A1');
        if (a1) {
            document.getElementById('title-main').textContent = a1;
        }

        // 日期 C1
        const c1 = cell('C1');
        if (c1) {
            document.getElementById('date-badge').textContent = c1;
        }

        // 備註改 A8
        const note = cell('A8');
        if (note) {
            const footer = document.getElementById('footer-note');
            footer.innerHTML = note.replace(/\r?\n/g, '<br>');
        }

        // 6 格內文 & logo 映射
        // 文字：第一排 A3斷一行+A4、B3+A4、C3+C4；第二排 A6+A7、B6+B7、C6+C7
        const textPairs = [
            ['A3','A4'],
            ['B3','B4'],
            ['C3','C4'],
            ['A6','A7'],
            ['B6','B7'],
            ['C6','C7']
        ];
        // 圖片名稱：第一排 A2,B2,C2；第二排 A6,B6,C6

const logoAddrs = ['A2','B2','C2','A5','B5','C5'];

        const cards = document.querySelectorAll('.card');
        cards.forEach((card, idx) => {
            const pair = textPairs[idx] || [];
            const lAddr = logoAddrs[idx];
            const parts = pair.map(addr => addr ? cell(addr) : '').filter(Boolean);
            const textVal = parts.join('\n');
            const logoName = lAddr ? cell(lAddr) : '';
            applyCardContent(card, logoName, textVal);
        });

        hasWorkOrder = true;
        showToast('工單載入完成', 'success');
    };
    reader.readAsArrayBuffer(file);
});

// 套用一格的 logo + 內文
function applyCardContent(cardElem, logoName, cellText) {
    const logoImg = cardElem.querySelector('.card-logo');
    const inner = cardElem.querySelector('.card-inner');
    inner.innerHTML = '';

    // 存下 logo 名稱供之後重新套用
    cardElem.dataset.logoName = logoName || '';

    // LOGO：模糊比對圖片檔名
    if (logoImg) {
        logoImg.src = findLogoSrc(logoName);
    }

    if (cellText === null || cellText === undefined) return;

    // 內文支援 Excel 斷行（Alt+Enter）：會是 \r\n 或 \n，都會被 split，完全忠實保留空行
    const lines = String(cellText).split(/\r?\n/);

    lines.forEach(line => {
        const div = document.createElement('div');
        div.className = 'line-text';
        div.contentEditable = 'true';

        // 日期行目前不加額外間距（已取消第二段日期額外 px 的需求）
        if (/^\s*\d{1,2}\/\d{1,2}/.test(line)) {
            div.style.marginTop = '0px';
        }

        // === 文字上色規則 ===
        // 1) 框起來的部分變紅字：支援 「」 / 【】 / " "
        // 2) 內文若出現「回饋」，從「回饋」（包含）之後全部變紅
        let raw = line;

        // 3) 若整行以 ( 開頭且以 ) 結尾，整段（含括號）改為灰字
        const t = String(raw).trim();
        if (t.startsWith('(') && t.endsWith(')') && t.length >= 2) {
            div.classList.add('line-gray');
            div.textContent = raw;
            inner.appendChild(div);
            return;
        }


        // 觸發字：遇到「回饋」或「享」其後（包含觸發字）皆為紅字，取最早出現的位置
        const idx1 = raw.indexOf('回饋');
        const idx2 = raw.indexOf('享');
        const idx = (idx1 >= 0 && idx2 >= 0) ? Math.min(idx1, idx2) : (idx1 >= 0 ? idx1 : idx2);

        let before = idx >= 0 ? raw.slice(0, idx) : raw;
        let after  = idx >= 0 ? raw.slice(idx) : '';

        function applyQuoteHighlight(s) {
            let out = s;
            out = out.replace(/「([^「」]+)」/g, '<span class="line-red">$1</span>');
            out = out.replace(/【([^【】]+)】/g, '<span class="line-red">$1</span>');
            out = out.replace(/"([^"]+)"/g, '<span class="line-red">$1</span>');
            return out;
        }

        let html = applyQuoteHighlight(before);
        if (idx >= 0) {
            html += '<span class="line-red">' + applyQuoteHighlight(after) + '</span>';
        }

        div.innerHTML = html;
        inner.appendChild(div);
    });
}

/* ===== Logo 編輯器工具：上傳 / 拖曳 / 縮放 / 裁切 / 下載 ===== */
const logoEditorState = {
    img: null,
    imgSrc: '',
    originalFileName: 'logo_edited',
    scale: 1,
    x: 380,
    y: 210,
    dragging: false,
    startX: 0,
    startY: 0,
    startImgX: 0,
    startImgY: 0,
    cropW: 400,
    cropH: 92
};

function openLogoEditorTool() {
    const modal = document.getElementById('logoEditorModal');
    if (!modal) return;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(drawLogoEditor);
}

function closeLogoEditorTool() {
    const modal = document.getElementById('logoEditorModal');
    if (!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
}

function logoEditorCanvas() {
    return document.getElementById('logoEditorCanvas');
}

function logoEditorSetCrop() {
    const w = Number(document.getElementById('logoEditorCropW')?.value || 600);
    const h = Number(document.getElementById('logoEditorCropH')?.value || 180);
    const canvas = logoEditorCanvas();
    logoEditorState.cropW = Math.max(50, Math.min(canvas.width, w));
    logoEditorState.cropH = Math.max(30, Math.min(canvas.height, h));
    drawLogoEditor();
}

function logoEditorSetZoom(scale) {
    if (!logoEditorState.img) return;
    const next = Math.max(0.1, Math.min(4, Number(scale) || 1));
    logoEditorState.scale = next;
    const slider = document.getElementById('logoEditorZoom');
    const text = document.getElementById('logoEditorZoomText');
    if (slider) slider.value = Math.round(next * 100);
    if (text) text.textContent = Math.round(next * 100) + '%';
    drawLogoEditor();
}

function logoEditorZoomStep(step) {
    logoEditorSetZoom((logoEditorState.scale || 1) + step);
}

function logoEditorFit() {
    const canvas = logoEditorCanvas();
    const img = logoEditorState.img;
    if (!canvas || !img) return;
    const cropW = logoEditorState.cropW || 600;
    const cropH = logoEditorState.cropH || 180;
    const fit = Math.min(cropW / img.naturalWidth, cropH / img.naturalHeight);
    logoEditorState.scale = Math.max(0.1, Math.min(4, fit));
    logoEditorState.x = canvas.width / 2;
    logoEditorState.y = canvas.height / 2;
    logoEditorSetZoom(logoEditorState.scale);
    drawLogoEditor();
}

function drawLogoEditor(exportMode) {
    const canvas = logoEditorCanvas();
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cropW = Math.max(50, Math.min(canvas.width, logoEditorState.cropW || 600));
    const cropH = Math.max(30, Math.min(canvas.height, logoEditorState.cropH || 180));
    const cropX = (canvas.width - cropW) / 2;
    const cropY = (canvas.height - cropH) / 2;

    if (logoEditorState.img) {
        const img = logoEditorState.img;
        const w = img.naturalWidth * logoEditorState.scale;
        const h = img.naturalHeight * logoEditorState.scale;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, logoEditorState.x - w / 2, logoEditorState.y - h / 2, w, h);
    } else {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.font = '20px Arial, "Microsoft JhengHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('請先上傳 Logo 圖片', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    }

    if (!exportMode) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        ctx.fillRect(0, 0, canvas.width, cropY);
        ctx.fillRect(0, cropY + cropH, canvas.width, canvas.height - cropY - cropH);
        ctx.fillRect(0, cropY, cropX, cropH);
        ctx.fillRect(cropX + cropW, cropY, canvas.width - cropX - cropW, cropH);

        ctx.strokeStyle = '#00E5FF';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 5]);
        ctx.strokeRect(cropX, cropY, cropW, cropH);

        ctx.setLineDash([]);
        ctx.fillStyle = '#00E5FF';
        ctx.font = '13px Arial, "Microsoft JhengHei", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${Math.round(cropW)} × ${Math.round(cropH)} px`, cropX + 8, cropY + 18);
        ctx.restore();
    }
}

function downloadEditedLogo() {
    const canvas = logoEditorCanvas();
    const img = logoEditorState.img;
    if (!canvas || !img) {
        showToast('請先上傳圖片', 'error');
        return;
    }

    const cropW = Math.max(50, Math.min(canvas.width, logoEditorState.cropW || 600));
    const cropH = Math.max(30, Math.min(canvas.height, logoEditorState.cropH || 180));
    const cropX = (canvas.width - cropW) / 2;
    const cropY = (canvas.height - cropH) / 2;

    const output = document.createElement('canvas');
    output.width = Math.round(cropW);
    output.height = Math.round(cropH);
    const octx = output.getContext('2d');

    // JPG white background
    octx.fillStyle = '#FFFFFF';
    octx.fillRect(0, 0, output.width, output.height);

    // Re-render image into crop coordinates
    const w = img.naturalWidth * logoEditorState.scale;
    const h = img.naturalHeight * logoEditorState.scale;
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = 'high';
    octx.drawImage(img, logoEditorState.x - w / 2 - cropX, logoEditorState.y - h / 2 - cropY, w, h);

    const link = document.createElement('a');
    link.download = (logoEditorState.originalFileName || 'logo_edited') + '.jpg';
    link.href = output.toDataURL('image/jpeg', 0.95);
    link.click();
}

(function initLogoEditorTool(){
    const input = document.getElementById('logoEditorFile');
    const canvas = logoEditorCanvas();
    if (!input || !canvas) return;

    input.addEventListener('change', function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                logoEditorState.img = img;
                logoEditorState.imgSrc = evt.target.result;
                logoEditorState.originalFileName = (file.name || 'logo_edited').replace(/\.[^.]+$/, '');
                logoEditorSetCrop();
                logoEditorFit();
                showToast('Logo 已載入，可開始編輯', 'success');
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        input.value = '';
    });

    canvas.addEventListener('mousedown', function(e) {
        if (!logoEditorState.img) return;
        const rect = canvas.getBoundingClientRect();
        logoEditorState.dragging = true;
        logoEditorState.startX = (e.clientX - rect.left) * (canvas.width / rect.width);
        logoEditorState.startY = (e.clientY - rect.top) * (canvas.height / rect.height);
        logoEditorState.startImgX = logoEditorState.x;
        logoEditorState.startImgY = logoEditorState.y;
        canvas.classList.add('dragging');
        e.preventDefault();
    });

    window.addEventListener('mousemove', function(e) {
        if (!logoEditorState.dragging) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        logoEditorState.x = logoEditorState.startImgX + (x - logoEditorState.startX);
        logoEditorState.y = logoEditorState.startImgY + (y - logoEditorState.startY);
        drawLogoEditor();
    });

    window.addEventListener('mouseup', function() {
        logoEditorState.dragging = false;
        canvas.classList.remove('dragging');
    });

    canvas.addEventListener('wheel', function(e) {
        if (!logoEditorState.img) return;
        e.preventDefault();
        logoEditorZoomStep(e.deltaY < 0 ? 0.05 : -0.05);
    }, { passive: false });

    drawLogoEditor();
})();

function fallbackCopyLogoArchivePath(path) {

    ta.value = path;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);

    document.execCommand('copy');
    ta.remove();
    if (typeof showToast === 'function') showToast('已複製 LOGO 歸檔路徑', 'success');
    else alert('已複製路徑');
}
